id: kubeconfig-file-permissions
name: Kubeconfig File Permissions Check
description: Ensures the kubeconfig file has restrictive permissions (600)
expression: |
  has(kubeconfig.mode) && kubeconfig.mode == "-rw-------"
inputs:
  - name: kubeconfig
    file:
      path: /etc/kubernetes/kubeconfig
      format: text
      recursive: false
      checkPermissions: true
tags:
  - security
  - compliance
  - kubernetes
  - file-permissions
category: file-security
severity: CRITICAL
extensions:
  compliance_framework: CIS
  control_id: "1.1.13"
  remediation: "Run 'chmod 600 /etc/kubernetes/kubeconfig' to set proper permissions"
  expected_mode: "600"
  expected_perm: "-rw-------"
check_id: kubeconfig-file-permissions